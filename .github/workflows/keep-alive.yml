name: Streamlit Keep Alive

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit App
        run: |
          curl -L --max-time 30 \
            "https://ml-project-mnyvazqsqvfpckqq869map.streamlit.app" \
            -o /dev/null